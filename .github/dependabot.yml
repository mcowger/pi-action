# Dependabot version-update configuration.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for bun/npm dependencies
  - package-ecosystem: "bun"
    # Look for `package.json` and lock files in the root directory
    directory: "/"
    # Check the npm registry for updates every week
    schedule:
      interval: "weekly"
    # Group minor + patch updates into a single PR (lower breaking-change risk).
    # Major updates are left ungrouped, so each gets its own PR for careful review.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "weekly"
    # Group minor + patch updates into a single PR (lower breaking-change risk).
    # Major updates are left ungrouped, so each gets its own PR for careful review.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
